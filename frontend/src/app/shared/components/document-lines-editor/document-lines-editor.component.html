<section class="document-lines" aria-label="Document lines">
  <div class="document-lines-heading">
    <div><h3>Document lines</h3><p>Add one or more revenue or expense lines.</p></div>
    <button class="add-line-button" type="button" [disabled]="lines.length >= 1000" (click)="addLine()"><i class="fa-solid fa-plus" aria-hidden="true"></i> Add line</button>
  </div>
  @for (line of lines; track $index; let i = $index) {
    <fieldset class="document-line">
      <legend>Line {{ i + 1 }}</legend>
      <label>
        {{ accountLabel }}
        <select appSearchableSelect [name]="'lineAccount' + i" required [disabled]="accountsLoading || accountsFailed" [ngModel]="line.accountId" [ngModelOptions]="{ standalone: true }" (ngModelChange)="updateLine(i, 'accountId', $event)">
          <option [ngValue]="null" disabled>
            @if (accountsLoading) { Loading accounts… }
            @else if (accountsFailed) { Could not load accounts }
            @else { Select account }
          </option>
          @for (choice of accounts; track choice.value) {
            <option [ngValue]="choice.value">{{ choice.label }}</option>
          }
        </select>
      </label>
      <label>
        Description
        <app-input [name]="'lineDescription' + i" required pattern=".*\S.*" maxlength="500" [value]="line.description" (input)="updateLine(i, 'description', $any($event.target).value)" />
      </label>
      <label>
        Quantity
        <app-input [name]="'lineQuantity' + i" type="number" min="0.000001" max="9999999999.999999" step="0.000001" required [value]="line.quantity" (input)="updateLine(i, 'quantity', $any($event.target).value)" />
      </label>
      <label>
        Unit price
        <app-input [name]="'lineUnitPrice' + i" type="number" min="0" max="99999999999999.999999" step="0.000001" required [value]="line.unitPrice" (input)="updateLine(i, 'unitPrice', $any($event.target).value)" />
      </label>
      <label>
        Tax code (optional)
        <select appSearchableSelect [name]="'lineTaxCode' + i" [disabled]="taxCodesLoading || taxCodesFailed" [ngModel]="line.taxCodeId" [ngModelOptions]="{ standalone: true }" (ngModelChange)="updateLine(i, 'taxCodeId', $event)">
          <option [ngValue]="null">
            @if (taxCodesLoading) { Loading tax codes… }
            @else if (taxCodesFailed) { Could not load tax codes }
            @else { No tax }
          </option>
          @for (choice of taxCodes; track choice.value) {
            <option [ngValue]="choice.value">{{ choice.label }}</option>
          }
        </select>
      </label>
      <button class="button secondary table-action remove-line" type="button" [disabled]="lines.length <= 1" (click)="removeLine(i)">Remove</button>
    </fieldset>
  }
  <p class="document-line-total">Subtotal before tax: {{ formattedSubtotal }}</p>
</section>
